services:
  swjtu-archive:
    build:
      context: .
      dockerfile: Dockerfile
      additional_contexts:
        swjtu-cli: ../../SWJTU-CLI
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SWJTU_ARCHIVE_DATA: /data
      SWJTU_ARCHIVE_ADDR: :8080
      SWJTU_ARCHIVE_SYNC_TIMES: "10:00,11:00,12:00,13:00,14:00,15:00,16:00,17:00,18:00,19:00,20:00"
      SWJTU_ARCHIVE_SYNC_ON_START: "false"
      SWJTU_ARCHIVE_BACKFILL: 1y
      SWJTU_ARCHIVE_ASSET_BASE_URL: ${SWJTU_ARCHIVE_ASSET_BASE_URL:-https://oss.swjtu.zip/news-assets}
      SWJTU_ARCHIVE_R2_ENDPOINT: ${SWJTU_ARCHIVE_R2_ENDPOINT:-}
      SWJTU_ARCHIVE_R2_BUCKET: ${SWJTU_ARCHIVE_R2_BUCKET:-}
      SWJTU_ARCHIVE_R2_PREFIX: ${SWJTU_ARCHIVE_R2_PREFIX:-news-assets}
      SWJTU_ARCHIVE_R2_ACCESS_KEY_ID: ${SWJTU_ARCHIVE_R2_ACCESS_KEY_ID:-}
      SWJTU_ARCHIVE_R2_SECRET_ACCESS_KEY: ${SWJTU_ARCHIVE_R2_SECRET_ACCESS_KEY:-}
      # Several audited sites have more than 500 generated list pages. Keep
      # the deployment limit above the largest source-reported total so a
      # normal sync cannot silently truncate a feed.
      SWJTU_ARCHIVE_MAX_PAGES: "1000"
    volumes:
      - /data/swjtu-archive:/data
