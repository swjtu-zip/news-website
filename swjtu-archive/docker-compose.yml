services:
  swjtu-archive:
    build:
      context: .
      dockerfile: Dockerfile
      additional_contexts:
        swjtu-cli: ../../SWJTU-CLI
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SWJTU_ARCHIVE_DATA: /data
      SWJTU_ARCHIVE_ADDR: :8080
      SWJTU_ARCHIVE_SYNC_TIMES: "12:00,18:00"
      SWJTU_ARCHIVE_SYNC_ON_START: "false"
      SWJTU_ARCHIVE_BACKFILL: 1y
      # Several audited sites have more than 500 generated list pages. Keep
      # the deployment limit above the largest source-reported total so a
      # normal sync cannot silently truncate a feed.
      SWJTU_ARCHIVE_MAX_PAGES: "1000"
    volumes:
      - /data/swjtu-archive:/data
