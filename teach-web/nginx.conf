server {
    listen 8080;
    server_name teach.swjtu.zip;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types application/json;
    gzip_min_length 1k;

    # 缓存分层与 news(swjtu-archive)一致:Cache-Control 管浏览器,
    # CDN-Cache-Control 单独给边缘(Cloudflare)。HTML 部署会变更,
    # 浏览器 5 分钟、边缘 1 小时;旧版本 assets 长期保留,过期 HTML 仍可用。
    location = / {
        add_header Cache-Control "public, max-age=300, s-maxage=3600" always;
        add_header CDN-Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files /index.html =404;
    }

    location = /index.html {
        add_header Cache-Control "public, max-age=300, s-maxage=3600" always;
        add_header CDN-Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri =404;
    }

    # Keep the public surface on one origin. The upstream name is replaced at
    # image build time and resolves through the Docker teaching network.
    location /api/ {
        # Compatibility for browsers that still have the first same-origin
        # bundle cached, which requested /api/api/v1/... by mistake.
        rewrite ^/api/api/(.*)$ /api/$1 break;
        proxy_pass http://__TEACH_API_UPSTREAM__;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering on;
        proxy_read_timeout 15s;
    }

    # MCP (Model Context Protocol) 端点,供 AI 助手查询教师/课程数据。
    # POST 请求,与 news 的非 GET 一律 no-store 保持一致。
    location = /mcp {
        add_header Cache-Control "no-store" always;
        add_header CDN-Cache-Control "no-store" always;
        proxy_pass http://__TEACH_API_UPSTREAM__;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header CDN-Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri =404;
    }

    # 活水评分数据每日同步一次,浏览器 5 分钟、边缘 1 小时。
    location /data/ {
        add_header Cache-Control "public, max-age=300, s-maxage=3600" always;
        add_header CDN-Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "public, max-age=300, s-maxage=3600" always;
        add_header CDN-Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri $uri/ /index.html;
    }
}
